<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>În Acord — schiță</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #20241e;
        background: #f3f3ee;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        min-width: 19rem;
        min-height: 100vh;
        margin: 0;
        background: #f3f3ee;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      .app {
        min-height: 100vh;
      }

      .topbar {
        position: sticky;
        z-index: 20;
        top: 0;
        display: grid;
        grid-template-columns: 3.35rem minmax(12rem, 1fr) auto;
        gap: 0.85rem;
        align-items: center;
        min-height: 5.25rem;
        padding: 0.9rem 1.15rem;
        border-bottom: 1px solid #dedfd7;
        background: rgb(250 250 246 / 94%);
        backdrop-filter: blur(14px);
      }

      .icon-button {
        display: grid;
        width: 3.35rem;
        height: 3.35rem;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 1rem;
        color: #fff;
        background: #587050;
        cursor: pointer;
        transition:
          background 140ms ease,
          transform 140ms ease;
      }

      .icon-button:hover {
        background: #485e42;
        transform: translateY(-1px);
      }

      .icon-button svg,
      .nav-item svg,
      .search-box svg,
      .add-song-button svg,
      .card-arrow {
        width: 1.25rem;
        height: 1.25rem;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .search-box {
        position: relative;
        display: flex;
        width: min(100%, 42rem);
        align-items: center;
      }

      .search-box svg {
        position: absolute;
        left: 1rem;
        color: #7b8378;
        pointer-events: none;
      }

      .search-box input {
        width: 100%;
        min-height: 3.35rem;
        padding: 0.75rem 1rem 0.75rem 3rem;
        border: 1px solid #d9dbd3;
        border-radius: 1rem;
        outline: none;
        color: #20241e;
        background: #fff;
        transition:
          border-color 140ms ease,
          box-shadow 140ms ease;
      }

      .search-box input:focus {
        border-color: #75876f;
        box-shadow: 0 0 0 3px rgb(88 112 80 / 13%);
      }

      .add-song-button {
        display: inline-flex;
        min-height: 3.35rem;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 1rem;
        color: #fff;
        background: #20241e;
        cursor: pointer;
        font-weight: 760;
        white-space: nowrap;
        transition:
          background 140ms ease,
          transform 140ms ease;
      }

      .add-song-button:hover {
        background: #343b31;
        transform: translateY(-1px);
      }

      .workspace {
        display: grid;
        grid-template-columns: 14.5rem minmax(0, 1fr);
        min-height: calc(100vh - 5.25rem);
      }

      .sidebar {
        position: sticky;
        top: 5.25rem;
        height: calc(100vh - 5.25rem);
        padding: 1rem 0.9rem;
        border-right: 1px solid #dedfd7;
        background: #f8f8f4;
      }

      .sidebar-nav {
        display: flex;
        height: 100%;
        flex-direction: column;
        gap: 0.35rem;
      }

      .nav-item {
        display: flex;
        width: 100%;
        min-height: 3rem;
        align-items: center;
        gap: 0.8rem;
        padding: 0.7rem 0.85rem;
        border: 0;
        border-radius: 0.85rem;
        color: #62695f;
        background: transparent;
        cursor: pointer;
        font-size: 0.92rem;
        font-weight: 650;
        text-align: left;
      }

      .nav-item:hover {
        color: #31382e;
        background: #edefe8;
      }

      .nav-item.active {
        color: #405039;
        background: #e3e9df;
      }

      .nav-item.settings {
        margin-top: auto;
      }

      .nav-count {
        display: inline-flex;
        min-width: 1.55rem;
        min-height: 1.55rem;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        padding: 0.15rem 0.4rem;
        border-radius: 999px;
        color: #697064;
        background: #e8eae4;
        font-size: 0.68rem;
        font-weight: 800;
      }

      .nav-item.active .nav-count {
        color: #405039;
        background: #d5dfd0;
      }

      .main-content {
        min-width: 0;
        padding: 1.25rem;
      }

      .song-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr));
        gap: 1rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .song-card {
        position: relative;
        display: flex;
        min-height: 10.2rem;
        flex-direction: column;
        padding: 1.15rem;
        overflow: hidden;
        border: 1px solid #ddded6;
        border-radius: 1.15rem;
        color: #20241e;
        background: #fff;
        box-shadow: 0 0.5rem 1.8rem rgb(37 45 34 / 5%);
        cursor: pointer;
        text-align: left;
        transition:
          border-color 140ms ease,
          box-shadow 140ms ease,
          transform 140ms ease;
      }

      .song-card:hover {
        border-color: #b9c2b5;
        box-shadow: 0 0.8rem 2.2rem rgb(37 45 34 / 9%);
        transform: translateY(-2px);
      }

      .song-card h2 {
        max-width: calc(100% - 1.5rem);
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.3;
        letter-spacing: -0.015em;
      }

      .card-arrow {
        position: absolute;
        top: 1.05rem;
        right: 1rem;
        color: #9da49a;
      }

      .last-sung {
        margin: 0.75rem 0 0;
        color: #7a8176;
        font-size: 0.78rem;
        line-height: 1.4;
      }

      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        margin-top: auto;
        padding-top: 1rem;
      }

      .category-pill,
      .transpose-pill {
        display: inline-flex;
        min-height: 1.75rem;
        align-items: center;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 760;
      }

      .category-pill {
        max-width: 10rem;
        padding: 0.25rem 0.65rem;
        overflow: hidden;
        color: #596654;
        background: #edf1e9;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .transpose-pill {
        min-width: 2.2rem;
        justify-content: center;
        padding: 0.25rem 0.5rem;
        color: #555d51;
        background: #f0f1ed;
      }

      .transpose-editor {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }

      .transpose-step-button {
        width: 1.9rem;
        height: 1.9rem;
        padding: 0;
        border: 1px solid #cfd4ca;
        border-radius: 999px;
        color: #43513f;
        background: #edf1e9;
        cursor: pointer;
        font-weight: 800;
      }

      .transpose-step-button:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }

      dialog {
        width: min(calc(100% - 2rem), 36rem);
        max-height: calc(100vh - 2rem);
        margin: auto;
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: 1.35rem;
        color: #20241e;
        background: #fff;
        box-shadow: 0 2rem 6rem rgb(27 34 25 / 30%);
      }

      dialog::backdrop {
        background: rgb(24 29 22 / 48%);
        backdrop-filter: blur(4px);
      }

      .dialog-body {
        max-height: calc(100vh - 2rem);
        padding: 1.3rem;
        overflow-y: auto;
      }

      .dialog-heading {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.35rem;
      }

      .dialog-heading h2 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }

      .dialog-heading-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 0.45rem;
      }

      .edit-icon-button {
        display: grid;
        width: 2.5rem;
        height: 2.5rem;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 0.8rem;
        color: #596055;
        background: #f0f1ec;
        cursor: pointer;
      }

      .edit-icon-button svg {
        width: 1.15rem;
        height: 1.15rem;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .close-button {
        width: 2.5rem;
        height: 2.5rem;
        flex: 0 0 auto;
        border: 0;
        border-radius: 0.8rem;
        color: #596055;
        background: #f0f1ec;
        cursor: pointer;
      }

      form,
      label {
        display: grid;
      }

      form {
        gap: 1rem;
      }

      label {
        gap: 0.45rem;
        color: #555d51;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .form-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 8rem;
        gap: 0.8rem;
      }

      form input,
      form textarea {
        width: 100%;
        border: 1px solid #d3d6ce;
        border-radius: 0.85rem;
        outline: none;
        color: #20241e;
        background: #fafaf7;
      }

      form input {
        min-height: 3rem;
        padding: 0.75rem 0.9rem;
      }

      form textarea {
        min-height: 13rem;
        padding: 0.9rem;
        resize: vertical;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        line-height: 1.55;
      }

      form input:focus,
      form textarea:focus {
        border-color: #6f8267;
        box-shadow: 0 0 0 3px rgb(111 130 103 / 15%);
      }

      #edit-song-form {
        display: block;
      }

      .edit-title {
        width: 100%;
        min-height: 2.5rem;
        padding: 0.45rem 0.65rem;
        font-size: 1.1rem;
        font-weight: 750;
      }

      .edit-content {
        width: 100%;
        min-height: 20rem;
      }

      .primary-button {
        min-height: 3.1rem;
        margin-top: 0.25rem;
        border: 0;
        border-radius: 0.9rem;
        color: #fff;
        background: #526849;
        cursor: pointer;
        font-weight: 760;
      }

      .song-detail-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      .song-content {
        margin: 0;
        overflow-x: auto;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 1rem;
        line-height: 1.75;
        white-space: pre-wrap;
      }

      .dialog-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.65rem;
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid #e4e5df;
      }

      .secondary-button {
        min-height: 2.85rem;
        padding: 0.65rem 0.9rem;
        border: 1px solid #cfd4ca;
        border-radius: 0.85rem;
        color: #43513f;
        background: #edf1e9;
        cursor: pointer;
        font-weight: 730;
      }

      .secondary-button:hover {
        border-color: #adb9a7;
        background: #e3e9df;
      }

      .secondary-button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      @media (max-width: 38rem) {
        .topbar {
          grid-template-columns: 3.2rem minmax(0, 1fr) auto;
          padding-inline: 0.75rem;
        }

        .add-song-button span {
          display: none;
        }

        .add-song-button {
          width: 3.2rem;
          padding-inline: 0;
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: sticky;
          z-index: 15;
          top: 5.25rem;
          width: 100%;
          height: auto;
          padding: 0.55rem 0.75rem;
          overflow-x: auto;
          border-right: 0;
          border-bottom: 1px solid #dedfd7;
        }

        .sidebar-nav {
          width: max-content;
          flex-direction: row;
        }

        .nav-item {
          width: auto;
          min-height: 2.65rem;
          white-space: nowrap;
        }

        .nav-item.settings {
          margin-top: 0;
        }

        .main-content {
          padding: 0.85rem;
        }
      }

      @media (max-width: 32rem) {
        .topbar {
          grid-template-columns: 3.1rem 3.1rem;
          grid-template-areas:
            "home add"
            "search search";
        }

        .home-button {
          grid-area: home;
        }

        .search-box {
          grid-area: search;
        }

        .add-song-button {
          grid-area: add;
          justify-self: end;
        }

        .sidebar {
          top: 9.45rem;
        }

        .song-grid {
          grid-template-columns: 1fr;
        }

        .song-card {
          min-height: 9.25rem;
        }

        .form-row {
          grid-template-columns: 1fr;
        }

        dialog {
          width: calc(100% - 1rem);
          max-height: calc(100vh - 1rem);
          border-radius: 1.1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button class="icon-button home-button" type="button" aria-label="Pagina principală">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 11 9-8 9 8" />
            <path d="M5 10v10h14V10" />
            <path d="M9 20v-6h6v6" />
          </svg>
        </button>

        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-4-4" />
          </svg>
          <input type="search" placeholder="Caută o cântare..." aria-label="Caută o cântare" />
        </label>

        <button id="open-add-dialog" class="add-song-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>Adaugă cântare</span>
        </button>
      </header>

      <div class="workspace">
        <aside class="sidebar" aria-label="Secțiunile aplicației">
          <nav class="sidebar-nav">
            <button class="nav-item active" type="button" data-section="songs">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z" /><path d="M8 9h8M8 13h8" /></svg>
              Cântări
              <span class="nav-count" data-count="songs">6</span>
            </button>
            <button class="nav-item" type="button" data-section="drafts">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16z" /><path d="m13.5 6.5 4 4" /></svg>
              Schițe
              <span class="nav-count" data-count="drafts">3</span>
            </button>
            <button class="nav-item" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4M16 3v4M3 10h18" /></svg>
              Programe
            </button>
            <button class="nav-item" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5M12 7v5l3 2" /></svg>
              Istoric
            </button>
            <button class="nav-item" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13 11 22l-9-9V4h9z" /><circle cx="7" cy="9" r="1.5" /></svg>
              Categorii
            </button>
            <button class="nav-item" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" /></svg>
              Favorite
            </button>
            <button class="nav-item settings" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" /></svg>
              Setări
            </button>
          </nav>
        </aside>

        <main class="main-content">
          <ul id="song-grid" class="song-grid" aria-label="Toate cântările">
            <li><button class="song-card" type="button" data-transpose="+3" data-category="Încurajare" data-last-sung="18 octombrie" data-content="[C]Harul Tău îmi este de ajuns&#10;[G]În orice zi, în orice ceas"><h2>Harul Tău îmi este de ajuns</h2><svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg><p class="last-sung">Ultima dată: 18 octombrie</p><span class="card-footer"><span class="category-pill">Încurajare</span><span class="transpose-pill">+3</span></span></button></li>
            <li><button class="song-card" type="button" data-transpose="0" data-category="Credință" data-last-sung="Duminica trecută" data-content="[Am]Mă încred în Tine&#10;[F]Chiar când nu pot vedea"><h2>Mă încred în Tine</h2><svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg><p class="last-sung">Ultima dată: duminica trecută</p><span class="card-footer"><span class="category-pill">Credință</span><span class="transpose-pill">0</span></span></button></li>
            <li><button class="song-card" type="button" data-transpose="-2" data-category="Mulțumire" data-last-sung="2 septembrie" data-content="[G]Credincioșia Ta rămâne&#10;[D]Din veșnicie în veșnicie"><h2>Credincioșia Ta</h2><svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg><p class="last-sung">Ultima dată: 2 septembrie</p><span class="card-footer"><span class="category-pill">Mulțumire</span><span class="transpose-pill">-2</span></span></button></li>
            <li><button class="song-card" type="button" data-transpose="0" data-category="Rugăciune" data-last-sung="Niciodată" data-content="[C]Doamne, vin înaintea Ta&#10;[F]Cu inima deschisă"><h2>Doamne, vin înaintea Ta</h2><svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg><p class="last-sung">Nu a fost cântată încă</p><span class="card-footer"><span class="category-pill">Rugăciune</span><span class="transpose-pill">0</span></span></button></li>
            <li><button class="song-card" type="button" data-transpose="+1" data-category="Laudă" data-last-sung="5 august" data-content="[D]Tu ești lumina mea&#10;[A]Și cărarea mea"><h2>Tu ești lumina mea</h2><svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg><p class="last-sung">Ultima dată: 5 august</p><span class="card-footer"><span class="category-pill">Laudă</span><span class="transpose-pill">+1</span></span></button></li>
            <li><button class="song-card" type="button" data-transpose="0" data-category="Venirea Domnului" data-last-sung="12 iulie" data-content="[Em]Aștept venirea Ta&#10;[C]Cu ochii către cer"><h2>Aștept venirea Ta</h2><svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg><p class="last-sung">Ultima dată: 12 iulie</p><span class="card-footer"><span class="category-pill">Venirea Domnului</span><span class="transpose-pill">0</span></span></button></li>
          </ul>

          <ul id="draft-grid" class="song-grid" aria-label="Schițe și cântări în pregătire" hidden>
            <li><button class="song-card" type="button" data-transpose="0" data-category="În lucru" data-last-sung="Schiță" data-content="[C]Primul vers este încă în lucru...&#10;&#10;Refren:&#10;[F]O idee pentru refren..."><h2>O cântare nouă</h2><svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg><p class="last-sung">Text incomplet</p><span class="card-footer"><span class="category-pill">În lucru</span><span class="transpose-pill">0</span></span></button></li>
            <li><button class="song-card" type="button" data-transpose="+2" data-category="De învățat" data-last-sung="Schiță" data-content="[G]Textul este pregătit&#10;[D]Mai trebuie învățată linia melodică"><h2>Când nu mai pot</h2><svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg><p class="last-sung">Pregătită pentru învățare</p><span class="card-footer"><span class="category-pill">De învățat</span><span class="transpose-pill">+2</span></span></button></li>
            <li><button class="song-card" type="button" data-transpose="-1" data-category="De revizuit" data-last-sung="Schiță" data-content="[Am]Acordurile trebuie verificate&#10;[F]Textul este aproape gata"><h2>În fiecare dimineață</h2><svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg><p class="last-sung">Acorduri de verificat</p><span class="card-footer"><span class="category-pill">De revizuit</span><span class="transpose-pill">-1</span></span></button></li>
          </ul>
        </main>
      </div>
    </div>

    <dialog id="add-song-dialog">
      <div class="dialog-body">
        <div class="dialog-heading">
          <h2>Adaugă o cântare</h2>
          <button class="close-button" type="button" data-close-add aria-label="Închide">✕</button>
        </div>
        <form id="add-song-form">
          <div class="form-row">
            <label>Titlu<input name="title" required maxlength="200" autocomplete="off" /></label>
            <label>±<input name="transposeOffset" type="number" value="0" min="-12" max="12" aria-label="Valoare plus sau minus" /></label>
          </div>
          <label>Text și acorduri<textarea name="content" required placeholder="[C]Primul vers...&#10;[G]Al doilea vers..."></textarea></label>
          <button class="primary-button" type="submit">Adaugă cântarea</button>
        </form>
      </div>
    </dialog>

    <dialog id="song-detail-dialog">
      <div class="dialog-body">
        <form id="edit-song-form">
          <div class="dialog-heading">
            <div>
              <h2 id="detail-title"></h2>
              <input id="edit-title" class="edit-title" type="text" maxlength="200" aria-label="Titlu" hidden />
            </div>
            <div class="dialog-heading-actions">
              <button id="edit-song-button" class="edit-icon-button" type="button" aria-label="Editează cântarea">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16z" /><path d="m13.5 6.5 4 4" /></svg>
              </button>
              <button class="close-button" type="button" data-close-detail aria-label="Închide">✕</button>
            </div>
          </div>
          <div class="song-detail-meta">
            <span id="detail-category" class="category-pill"></span>
            <span class="transpose-editor">
              <button id="decrease-transpose" class="transpose-step-button" type="button" aria-label="Scade cu 1" hidden>−</button>
              <span id="detail-transpose" class="transpose-pill"></span>
              <button id="increase-transpose" class="transpose-step-button" type="button" aria-label="Crește cu 1" hidden>+</button>
            </span>
            <span id="detail-last-sung" class="category-pill"></span>
          </div>
          <pre id="detail-content" class="song-content"></pre>
          <textarea id="edit-content" class="edit-content" aria-label="Text și acorduri" hidden></textarea>
          <div class="dialog-actions">
            <button id="save-song-button" class="primary-button" type="submit" hidden>Salvează</button>
            <button id="move-song-button" class="secondary-button" type="button"></button>
          </div>
        </form>
      </div>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
